<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<link rel="icon" href="%PUBLIC_URL%/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="The Rehabilitation Center AURUM">
<meta name="robots" content="index, follow">
<meta name="keywords" content="Реабілітація, медична допомога, лікування">
<!-- <meta property="og:image" content="%PUBLIC_URL%/logo-en.png"/> -->
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<!-- <meta property="og:site_name" content="AURUM"> -->
<meta property="og:type" content="website"> 
<meta name="google" content="notranslate">

<script type="text/javascript">(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
</script>
<script>
  (function () {
    // Определяем язык из URL (например, "/ua" → "ua")
    const langMatch = window.location.pathname.match(/\/(en|de|ua)(\/|$)/);
    const lang = langMatch ? langMatch[1] : "ua";

    const logoMap = {
      en: "%PUBLIC_URL%/logo-en.png",
      de: "%PUBLIC_URL%/logo-de.png",
      ua: "%PUBLIC_URL%/logo-ua.png"
    };

    // Проверяем, есть ли уже тег <meta property="og:image">
    let ogImageMeta = document.querySelector('meta[property="og:image"]');
    
    if (!ogImageMeta) {
      // Если нет, создаем новый <meta> и добавляем в <head>
      ogImageMeta = document.createElement("meta");
      ogImageMeta.setAttribute("property", "og:image");
      document.head.appendChild(ogImageMeta);
    }

    // Устанавливаем нужное изображение
    ogImageMeta.setAttribute("content", logoMap[lang] || logoMap.ua);
  })();
</script>
</head>
<body>
  <div id="root">

  </div>
</body>
</html>
